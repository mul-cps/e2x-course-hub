[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "e2x-course-hub"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Tim Metzler", email = "tim.metzler@h-brs.de" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pydantic>=2.0",
  "jinja2",
  "PyYAML",
  "jupyterhub==5.5.2",
  "e2x-hub-rbac @ git+https://github.com/DigiKlausur/e2x-hub-rbac.git@4683d1a09051f8aa0d38a2e6ab181b4979b246b2"
]

[project.urls]
Documentation = "https://github.com/Digiklausur/e2x-course-hub#readme"
Issues = "https://github.com/Digiklausur/e2x-course-hub/issues"
Source = "https://github.com/Digiklausur/e2x-course-hub"

[project.optional-dependencies]
dev = [
  "pre-commit",
  "ruff",
  "tbump",
  "build",
  "twine",
]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
]

[tool.hatch.version]
path = "e2x_course_hub/__about__.py"

[tool.hatch.build.targets.wheel.shared-data]
"share/e2x_course_hub" = "share/e2x_course_hub"

[tool.hatch.build]
artifacts = [
  "share/e2x_course_hub/static/course-service-ui/*",
]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder"]
build-function = "hatch_jupyter_builder.npm_builder"

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
path = "course-service-ui"

[tool.tbump]
github_url = "https://github.com/Digiklausur/e2x-course-hub"

[tool.tbump.version]
current = "0.1.1"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (?P<rc>rc\d+)?
  '''

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

# Files with the version to update
[[tool.tbump.file]]
src = "e2x_course_hub/__about__.py"

[[tool.tbump.file]]
src = "course-service-ui/package.json"

[[tool.tbump.before_commit]]
name = "Build"
cmd = "python -m build"

[[tool.tbump.before_commit]]
name = "Check with twine"
cmd = "twine check dist/*"

[tool.ruff]
line-length = 100
lint.select = ["F", "E", "I"]
